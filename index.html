<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Créer un nouvel examen</title>
</head>
<body>

  <h2>Créer un nouvel examen</h2>

  <form id="form-examen">
    
    <!-- nom examen-->
    <div>
      <label>Nom de l'examen :</label>
      <input type="text" id="nom" required>
    </div>

    <!-- la duree-->
    <div>
      <label>Durée (en minutes) :</label>
      <input type="number" id="duree" required>
    </div>

    <!-- اdescription -->
    <div>
      <label>Description :</label>
      <textarea id="description"></textarea>
    </div>

    <div>
      <label>Nom du propriétaire :</label>
      <input type="text" id="proprietaire" required>
    </div>

    <button type="submit">Ajouter l'examen</button>
    <br>
    <a href="ajouter-question.html">Aller vers l'ajout des questions</a> | 
    <a href="examens.html">Consulter les examens</a>
  </form>

  <div id="liste-examens">
     <script src="script.js"></script>
  </div>

</body>
</html>
