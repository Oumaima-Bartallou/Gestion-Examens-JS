<form id="form-question">
   
    <div>
        <label>Propriétaire de l'examen :</label>
        <input type="text" id="owner-name" required>
    </div>


    <div>
        <label>Nom de l'examen :</label>
        <input type="text" id="exam-name" required>
    </div>

   
    <div>
        <label>Énoncé de la question :</label>
        <input type="text" id="enonce" required>
    </div>

    <div>
        <label>Durée (secondes) :</label>
        <input type="number" id="duree-q" required>
        <label>Points :</label>
        <input type="number" id="points" required>
    </div>


    <div id="propositions"></div>

    <button type="button" id="add-proposition">Ajouter une proposition</button>
    <button type="submit">Ajouter la question</button>
</form>
